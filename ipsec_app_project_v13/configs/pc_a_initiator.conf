# PC-A compatibility test endpoint
role=initiator
local_ip=192.168.1.143
remote_ip=192.168.1.144
local_cidr=192.168.1.143/24
local_id=side-a
remote_id=side-b
interface=eth0
psk_file=./ipsec_test.psk
service_name=strongswan.service
# Explicitly target the host charon VICI socket.  This avoids accidentally
# talking to the old namespace test sockets such as charon-nsA.vici.
vici_uri=unix:///run/charon.vici
connection_name=app-test
child_name=app-test-child
output_root=./results
ike_proposals=aes256-sha256-prfsha256-modp2048
esp_proposals=aes256-sha256
ipsec_mode=transport
udp_port=9000
matrix_control_port=9001
packet_count=20
payload_size=256
timeout_sec=60
capture_drain_ms=1000
capture_buffer_kib=4096
measurement_guard_ms=250
capture_enabled=true
manage_firewall=false
configure_address=false
cleanup_existing_sa=true
terminate_on_exit=true
