# strongSwan 5.9.13 <-> 5.8.4 compatibility matrix
#
# This matrix is intentionally built from algorithms present in BOTH uploaded
# swanctl --list-algs outputs.  A charon capability does not guarantee Linux
# kernel/XFRM support for ESP, so every enabled positive case still has to
# install a CHILD SA and pass real UDP/XFRM traffic.
#
# Run the SAME file on both peers.  The matrix runner synchronizes after each
# peer has loaded the testcase configuration before the initiator starts IKE.
#
# expected=pass       : IKE+CHILD+UDP+XFRM must pass
# expected=ike_fail   : no IKE/CHILD SA is expected (negative test)
# expected=child_fail : IKE may exist but CHILD must not be ready

[BASE-001]
name=AES256-CBC_SHA256_PRFSHA256_MODP2048
category=baseline
enabled=true
ike_proposals=aes256-sha256-prfsha256-modp2048
esp_proposals=aes256-sha256
ipsec_mode=transport
expected=pass

