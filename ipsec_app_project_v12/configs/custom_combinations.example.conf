# v12 custom mode example
# Run on BOTH peers with:
#   sudo ./ipsec_app --config configs/pc_a_initiator.conf \
#     --mode custom --matrix configs/custom_combinations.example.conf
#
# Only enabled=true entries run unless --case explicitly selects an entry.

[CUSTOM-AES256-GCM]
name=CUSTOM_AES256_GCM16
category=custom
enabled=true
ike_proposals=aes256-sha256-prfsha256-modp2048
esp_proposals=aes256gcm16
ipsec_mode=transport
expected=pass

[CUSTOM-PFS-ECP384]
name=CUSTOM_AES256_SHA256_PFS_ECP384
category=custom
enabled=true
ike_proposals=aes256-sha256-prfsha384-ecp384
esp_proposals=aes256-sha256-ecp384
ipsec_mode=transport
expected=pass
separate_child_exchange=true
expected_child_ke=ECP_384
